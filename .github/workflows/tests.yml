name: Tests
permissions:
  contents: read
on: [push, pull_request, workflow_dispatch]

jobs:
  tests:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-14
            python-version: "3.12"
          - os: windows-2022
            python-version: "3.12"

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24

    - name: Cache Playwright browsers
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ github.workspace }}/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('tox.ini') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright system dependencies
      if: runner.os == 'Linux'
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 5
        max_attempts: 3
        command: pip install playwright && playwright install-deps

    - name: Install tox
      run: pip install tox

    - name: Run asyncio tests
      run: tox -e py

    - name: Run pinned dependency tests (Windows, asyncio tests)
      if: runner.os == 'Windows'
      run: tox -e py-pinned

    - name: Run pinned dependency tests (Windows, Twisted tests)
      if: runner.os == 'Windows'
      run: tox -e py-pinned-twisted

    - name: Upload coverage report (Linux)
      if: runner.os == 'Linux'
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      run: |
        curl -Os https://uploader.codecov.io/latest/linux/codecov
        chmod +x codecov
        ./codecov

    - name: Upload coverage report (macOS)
      if: runner.os == 'macOS'
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      run: |
        curl -Os https://uploader.codecov.io/latest/macos/codecov
        chmod +x codecov
        ./codecov

    - name: Upload coverage report (Windows)
      if: runner.os == 'Windows'
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      run: |
        $ProgressPreference = 'SilentlyContinue'
        Invoke-WebRequest -Uri https://uploader.codecov.io/latest/windows/codecov.exe -Outfile codecov.exe
        .\codecov.exe

  tests-pinned:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Set up Python 3.10
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.10"

    - name: Set up node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24

    - name: Cache Playwright browsers
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ github.workspace }}/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('tox.ini') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright system dependencies
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 5
        max_attempts: 3
        command: pip install playwright && playwright install-deps

    - name: Install tox
      run: pip install tox

    - name: Run asyncio tests with pinned versions
      run: tox -e py-pinned

    - name: Run twisted tests with pinned versions
      run: tox -e py-pinned-twisted

    - name: Upload coverage report
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      run: |
        curl -Os https://uploader.codecov.io/latest/linux/codecov
        chmod +x codecov
        ./codecov
