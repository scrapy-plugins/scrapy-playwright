repos:
- repo: https://github.com/sphinx-contrib/sphinx-lint
  rev: v1.0.2
  hooks:
    - id: sphinx-lint
- repo: https://github.com/scrapy/sphinx-scrapy
  rev: 0.9.0
  hooks:
    - id: sphinx-scrapy
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.29.0
  hooks:
    - id: zizmor
      args: [--no-progress, --fix]
